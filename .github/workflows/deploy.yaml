name: Deploy with inputs
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the target environment"
        required: true
        type: choice
        options:
          - dev
          - tst
          - prod
      message:
        required: true
        type: string
        default: "deployment from github"

jobs:
  display-details:
    name: Display workflow details
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: execute script
        env:
          TARGET_ENV: ${{inputs.environment}}
          CUSTOM_MESSAGE: ${{inputs.message}}
        run: python scripts/execution_info.py
